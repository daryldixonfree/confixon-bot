name: Config Bot

on:
  schedule:
    - cron: "*/30 * * * *"   # هر ۳۰ دقیقه
  workflow_dispatch: {}       # اجرای دستی از تب Actions برای تست

permissions:
  contents: write            # برای ذخیره‌ی seen.json داخل مخزن

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests "requests[socks]"

      - name: Download xray-core
        run: |
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray
          chmod +x xray

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_NAME: ${{ secrets.CHANNEL_NAME }}
          BOT_SOURCE_URL_Y: ${{ secrets.BOT_SOURCE_URL_Y }}
          BOT_SOURCE_URL_P: ${{ secrets.BOT_SOURCE_URL_P }}
        run: python config_bot.py

      - name: Save seen.json
        run: |
          git config user.name "config-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen.json"
          git push
