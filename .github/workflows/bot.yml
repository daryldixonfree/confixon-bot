name: Config Bot

on:
  schedule:
    - cron: "0 */3 * * *"   # هر ۳ ساعت یک‌بار
  workflow_dispatch: {}     # اجرای دستی از تب Actions برای تست

permissions:
  contents: write           # برای ذخیره‌ی seen.json و last_post.json داخل مخزن

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests "requests[socks]"

      - name: Download xray-core
        run: |
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray
          chmod +x xray

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_NAME: ${{ secrets.CHANNEL_NAME }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
        run: python confignew_bot.py

      - name: Save state files
        run: |
          git config user.name "config-bot"
          git config user.email "actions@users.noreply.github.com"
          touch seen.json last_post.json
          git add seen.json last_post.json
          git diff --cached --quiet || git commit -m "update bot state"
          git push
